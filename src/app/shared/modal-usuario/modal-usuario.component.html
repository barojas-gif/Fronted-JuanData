<div class="modal-backdrop-custom" *ngIf="mostrar">
  <div class="modal-content-custom">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-bold text-dark m-0">
        <i class="bi bi-person-plus-fill me-2 text-primary"></i>
        {{ usuarioExistente ? 'Actualizar Usuario' : 'Nuevo Usuario' }}
      </h4>
      <button type="button" class="btn-close" (click)="cerrar.emit()"></button>
    </div>

    <div class="modal-body-scroll">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="label-custom">Nombres</label>
          <input type="text" [(ngModel)]="nombre_usuario" class="minimal-input" placeholder="Ej: Brian">
        </div>

        <div class="col-md-6">
          <label class="label-custom">Apellidos</label>
          <input type="text" [(ngModel)]="apellido_usuario" class="minimal-input" placeholder="Ej: Rojas">
        </div>

        <div class="col-md-6">
          <label class="label-custom">Documento</label>
          <input type="text" [(ngModel)]="documento_usuario"
            (input)="soloNumeros($event, 'documento'); validarDocumento()" class="minimal-input"
            [class.is-invalid]="documentoExiste">
          <div class="text-danger small" *ngIf="documentoExiste">Este documento ya existe.</div>
        </div>

        <div class="col-md-6">
          <label class="label-custom">Teléfono</label>
          <input type="text" [(ngModel)]="telefono_usuario" (input)="soloNumeros($event, 'telefono')"
            class="minimal-input">
        </div>

        <div class="col-md-6">
          <label class="label-custom">Correo Institucional</label>
          <div class="input-group has-validation">
            <input type="text" [(ngModel)]="correo_usuario" (blur)="validarCorreo()" class="form-control minimal-input"
              [class.is-invalid]="correoExiste" placeholder="nombre.apellido">

            <span class="input-group-text bg-light text-muted small border-start-0">
              &#64;jdc.edu.co
            </span>

            <div class="invalid-feedback" *ngIf="correoExiste">
              Este correo institucional ya está registrado.
            </div>
          </div>
        </div>

        <div class="col-md-6" *ngIf="!usuarioExistente">
          <label class="label-custom">Contraseña</label>
          <input type="password" [(ngModel)]="contrasena_usuario" class="minimal-input" placeholder="******">
        </div>

        <div class="col-md-6">
          <label class="label-custom">Rol</label>
          <select [(ngModel)]="id_rol" class="minimal-input">
            <option value="" disabled>Seleccionar rol</option>
            <option *ngFor="let rol of roles" [value]="rol.idRol">
              {{ rol.nombreRol }}
            </option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="label-custom">Carrera</label>
          <select [(ngModel)]="id_carrera" (ngModelChange)="onCarreraChange()" class="minimal-input">
            <option value="" disabled>Seleccione una carrera</option>
            <option *ngFor="let carrera of carreras" [value]="carrera.idCarrera">
              {{ carrera.nombreCarrera }}
            </option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label font-weight-bold">
            Semillero Participante (Opcional)
          </label>

          <select class="form-select" [(ngModel)]="id_semillero" name="id_semillero">
            <option [value]="null">-- Sin Semillero / No aplica --</option>

            <option *ngFor="let semillero of semillerosFiltrados" [value]="semillero.id">
              {{ semillero.nombre }}
            </option>
          </select>

          <small class="text-muted">
            Este campo es opcional. El botón se habilitará al llenar los demás.
          </small>
        </div>


        <div class="modal-footer">
          <button type="button" class="btn btn-danger" (click)="cerrar.emit()">Cancelar</button>
          <button type="button" class="btn btn-success" [disabled]="formInvalido()" (click)="guardar()">
            {{ usuarioExistente ? 'Actualizar Registro' : 'Registrar Usuario' }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
