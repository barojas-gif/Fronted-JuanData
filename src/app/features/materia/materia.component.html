<app-menu></app-menu>

<div class="container mt-4 px-4">
  <div class="d-flex justify-content-end mb-4">
    <a href="#" (click)="abrirModal(null); $event.preventDefault()" class="btn-subir" title="Subir documentos">
      <i class="bi bi-file-earmark-plus-fill"></i>
      <span class="ms-2 fw-bold">Subir Documento</span>
    </a>
  </div>

  <app-subir-documento *ngIf="modalVisible" [visible]="modalVisible" [materia]="materiaSeleccionada"
    [materias]="materias" (cerrarModal)="cerrarModal()">
  </app-subir-documento>

  <div class="accordion accordion-flush shadow-sm rounded-3 overflow-hidden" id="accordionMaterias">
    <div class="accordion-item border-bottom" *ngFor="let materia of materias; let i = index">

      <h2 class="accordion-header" [id]="'heading' + i">
        <button class="accordion-button collapsed fw-semibold text-secondary" type="button" data-bs-toggle="collapse"
          [attr.data-bs-target]="'#collapse' + i" aria-expanded="false" [attr.aria-controls]="'collapse' + i"
          (click)="getDocumentosByMateria(materia.id_materia, materia)">
          <i class="bi bi-book me-3 text-primary"></i> {{ materia.nombre_materia }}
        </button>
      </h2>

      <div [id]="'collapse' + i" class="accordion-collapse collapse" [attr.aria-labelledby]="'heading' + i"
        data-bs-parent="#accordionMaterias">

        <div class="accordion-body bg-light-subtle">
          <ng-container *ngIf="materia.documentos && materia.documentos.length > 0; else sinDocumentos">

            <div class="input-group mb-3 shadow-sm">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
              <input type="text" [(ngModel)]="materia.filtroBusqueda" placeholder="Filtrar en esta materia..."
                class="form-control border-start-0 ps-0">
            </div>

            <div class="table-responsive rounded-3 border bg-white">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="py-3 ps-4">Título</th>
                    <th class="py-3">Tema</th>
                    <th class="py-3 text-center">Publicación</th>
                    <th class="py-3 text-center">Archivo</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let documento of filtrarDocumentos(materia)">
                    <td class="ps-4 fw-medium">{{ documento.tituloDocumento }}</td>
                    <td><span class="badge bg-secondary-subtle text-secondary-emphasis">{{ documento.temaDocumento
                        }}</span></td>
                    <td class="text-center text-muted small">{{ documento.fechaDocumento | date:'dd/MM/yyyy' }}</td>
                    <td class="text-center">
                      <a (click)="abrirDocumento(documento)" class="icono-archivo">
                        <ng-container [ngSwitch]="getExtension(documento.archivoDocumento)">
                          <i *ngSwitchCase="'pdf'" class="bi bi-file-pdf text-danger fs-4"></i>
                          <i *ngSwitchCase="'doc'" class="bi bi-file-word text-primary fs-4"></i>
                          <i *ngSwitchCase="'docx'" class="bi bi-file-word text-primary fs-4"></i>
                          <i *ngSwitchCase="'xls'" class="bi bi-file-excel text-success fs-4"></i>
                          <i *ngSwitchCase="'xlsx'" class="bi bi-file-excel text-success fs-4"></i>
                          <i *ngSwitchDefault class="bi bi-file-earmark fs-4"></i>
                        </ng-container>
                      </a>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </ng-container>

          <ng-template #sinDocumentos>
            <div class="text-center py-4 text-muted">
              <i class="bi bi-cloud-slash fs-2"></i>
              <p class="mb-0">Aún no hay documentos cargados.</p>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
