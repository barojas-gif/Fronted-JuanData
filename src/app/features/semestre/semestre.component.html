<div class="container py-5">
  <div class="row g-4">
    <div *ngFor="let semestre of semestres" class="col-12 col-sm-6 col-lg-4 col-xl-3">

      <div class="semester-card shadow-sm border-0" (click)="onSemestreClick(semestre)">

        <div class="card-visual">
          <i class="bi bi-mortarboard-fill"></i>
          <div class="overlay-circles"></div>
        </div>

        <div class="card-body text-center py-4">
          <h5 class="fw-bold mb-1">Semestre</h5>
          <span class="display-6 fw-bold text-primary">{{ semestre }}</span>

          <div class="mt-3">
            <a [routerLink]="['/Materia', semestre]" class="btn btn-outline-primary btn-sm rounded-pill px-4">
              Ver Materias
            </a>
          </div>
        </div>

      </div>

    </div>
  </div>
</div>
