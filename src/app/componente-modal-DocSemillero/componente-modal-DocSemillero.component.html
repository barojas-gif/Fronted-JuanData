<div class="modal fade" id="modalDocSemillero" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" style="max-width: 400px;">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 12px;">

      <div class="modal-header border-bottom-0 pt-4 px-4">
        <h6 class="modal-title fw-bold text-dark" style="letter-spacing: 1px;">
          <i class="bi bi-plus-circle-fill text-primary me-2"></i>NUEVO ARCHIVO
        </h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
          (click)="resetModal()"></button>
      </div>

      <div class="modal-body px-4 pb-4">

        <form autocomplete="off">
          <div class="mb-3">
            <label class="label-flat">Título del documento *</label>
            <input type="text" class="input-flat" placeholder="Escriba el nombre..." [(ngModel)]="tituloDocumento"
              name="tituloDocumento" required>
          </div>

          <div class="mb-3">
            <label class="label-flat">Tema / Área *</label>
            <input type="text" class="input-flat" placeholder="Ej: Investigación IA" [(ngModel)]="temaDocumento"
              name="temaDocumento" required>
          </div>

          <div class="mb-3">
            <label class="label-flat">Categoría *</label>
            <select class="input-flat" [(ngModel)]="categoriaDocumento" name="categoria" required>
              <option value="" disabled selected>Seleccione una opción</option>
              <option *ngFor="let cat of categoriasDisponibles" [value]="cat">{{ cat }}</option>
            </select>
          </div>

          <div class="mb-4">
            <label class="label-flat">Seleccionar archivo *</label>
            <input type="file" class="form-control form-control-sm border-0 bg-light py-2"
              (change)="onFilesSelected($event)" multiple [disabled]="subiendo">
            <div *ngIf="archivosSeleccionados.length > 0" class="file-count-label mt-2">
              <i class="bi bi-paperclip"></i> {{ archivosSeleccionados.length }} archivo(s) listos
            </div>
          </div>

          <div class="d-grid pt-2">
            <button type="button" class="btn-solid-save" (click)="subirDocumento()"
              [disabled]="subiendo || !tituloDocumento || !temaDocumento || !categoriaDocumento || archivosSeleccionados.length === 0">
              <span *ngIf="!subiendo">GUARDAR DATOS</span>
              <span *ngIf="subiendo">
                <span class="spinner-border spinner-border-sm me-2"></span>SUBIENDO...
              </span>
            </button>
            <button type="button" class="btn btn-link btn-sm text-muted mt-2 text-decoration-none"
              data-bs-dismiss="modal" (click)="resetModal()">Cancelar</button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
